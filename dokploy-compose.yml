# docker-compose.dokploy.yml
#
# Dokploy deployment variant of docker-compose.yml.
# Non-secret environment variables are baked in as defaults.
# Only the following variables must be set in Dokploy's Environment Variables tab:
#
#   INTERNAL_API_KEY         — shared secret for inter-container auth
#   JWT_SECRET               — secret for signing JWTs
#   BOOTSTRAP_ADMIN_PASSWORD — initial admin account password (remove after first deploy)
#   VITE_APP_HTTP_URL        — public URL of the app container as seen from the browser
#   VITE_BASE_PATH           — URL prefix for assets, e.g. /client/ (default: /)
#
# Optional overrides (Dokploy env tab):
#   BOOTSTRAP_ADMIN_USERNAME — defaults to "admin"
#   CORS_ORIGIN              — leave unset for single-server classroom use
#   OLLAMA_MODEL_DIGEST      — pin model digest for production safety
#
# Port binding is handled by Dokploy's domain/proxy configuration, not here.
# client and app use expose: only — bind them to domains in the Dokploy UI.
#
# Required host directories (create once on the DGX before first deploy):
#   mkdir -p ./scenarios ./data

services:

  # ── Client ──────────────────────────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_APP_HTTP_URL: ${VITE_APP_HTTP_URL}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    volumes:
      - ./scenarios:/usr/share/nginx/html/scenarios:ro
    expose:
      - "80"
    restart: unless-stopped

  # ── App ─────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      EVALUATION_URL:    http://evaluation:8001
      FEEDBACK_URL:      http://feedback:8002
      TRANSCRIPTION_URL: http://transcription:8003
      DATA_DIR:          /app/data
      SCENARIOS_DIR:     /app/scenarios
      PORT:              3000
      INTERNAL_API_KEY:          ${INTERNAL_API_KEY}
      JWT_SECRET:                ${JWT_SECRET}
      JWT_EXPIRY:                ${JWT_EXPIRY:-8h}
      ALLOW_REGISTRATION:        ${ALLOW_REGISTRATION:-false}
      BOOTSTRAP_ADMIN_USERNAME:  ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD:  ${BOOTSTRAP_ADMIN_PASSWORD}
      MAX_SESSIONS:              32
      MAX_QUEUE_SIZE:            10
      CAPACITY_POLICY:           QUEUE
      SESSION_TIMEOUT_MS:        30000
      RECOVERY_WINDOW_MS:        30000
      FEEDBACK_TIMEOUT_MS:       150000
      CORS_ORIGIN:               ${CORS_ORIGIN:-}
    volumes:
      - ./scenarios:/app/scenarios:ro
      - ./data:/app/data
    expose:
      - "3000"
    depends_on:
      transcription:
        condition: service_healthy
      evaluation:
        condition: service_healthy
    restart: unless-stopped

  # ── Transcription ────────────────────────────────────────────────────────────
  transcription:
    build:
      context: .
      dockerfile: transcription/Dockerfile
    environment:
      INTERNAL_API_KEY:   ${INTERNAL_API_KEY}
      PORT:                8003
      TRANSCRIPTION_POOL: production
      WHISPER_MODEL:      large-v3-turbo
      WHISPER_LANGUAGE:   nl
      WHISPER_WORKERS:    4
      DEVICE:             cuda
      # Overriding the default CTranslate2/Faster-Whisper cache path
      HF_HUB_CACHE:       /root/.cache/huggingface
    volumes:
      # Named volume isolates large whisper models across pipeline updates
      - hf_cache:/root/.cache/huggingface
    expose:
      - "8003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/transcription/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ── Evaluation ───────────────────────────────────────────────────────────────
  evaluation:
    build:
      context: .
      dockerfile: evaluation/Dockerfile
    environment:
      INTERNAL_API_KEY:   ${INTERNAL_API_KEY}
      PORT:                8001
      BEHAVIOUR_ANALYSER: production
      DEVICE:             cuda
    volumes:
      # Swapped out host relative bind mount for shared named volume reference
      - hf_cache:/root/.cache/huggingface
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/evaluate/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ── Feedback ─────────────────────────────────────────────────────────────────
  feedback:
    build:
      context: .
      dockerfile: feedback/Dockerfile
    environment:
      INTERNAL_API_KEY:       ${INTERNAL_API_KEY}
      PORT:                   8002
      FEEDBACK_GENERATOR:     production
      OLLAMA_HOST:            http://ollama:11434
      OLLAMA_MODEL:           qwen3:32b
      OLLAMA_TIMEOUT_MS:      120000
      OLLAMA_PULL_TIMEOUT_MS: 600000
      OLLAMA_MODEL_DIGEST:    ${OLLAMA_MODEL_DIGEST:-}
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/feedback/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ── Ollama ───────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama
    volumes:
      # Named volume isolates heavy LLM weights safely within Docker storage engines
      - ollama_storage:/root/.ollama
    expose:
      - "11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

# ── Named Volume Declarations ──────────────────────────────────────────────────
volumes:
  hf_cache:
    name: agressiontrainer_hf_cache
  ollama_storage:
    name: agressiontrainer_ollama_storage
