server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Include default MIME types so .js, .css, .html etc. are served correctly
    include /etc/nginx/mime.types;

    # Correct MIME type for WASM — not included in nginx defaults
    types {
        application/wasm wasm;
    }

    # Scenario video files — served directly from the mounted scenarios volume.
    # Only .mp4, .webm, and .ogv are served; all other file types (e.g. metadata.json)
    # return 404. Nginx handles byte-range requests natively, enabling video seeking.
    # Files are public — no auth is applied at this layer.
    location ~* ^/scenarios/.+\.(mp4|webm|ogv)$ {
        root /usr/share/nginx/html;
        add_header Accept-Ranges bytes;
        # Cache aggressively: video content is immutable within a deployment.
        # Increment the filename or scenario_id to bust the cache when content changes.
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Block all other /scenarios/ requests explicitly — no SPA fallback.
    location /scenarios/ {
        return 404;
    }

    # Admin scenario builder — serve admin.html for /admin and /admin/
    location = /admin {
        try_files /admin.html =404;
    }
    location = /admin/ {
        try_files /admin.html =404;
    }

    # SPA routing — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively, but never cache index.html or admin.html
    location ~* \.(js|css|png|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-store";
    }

    location = /admin.html {
        expires off;
        add_header Cache-Control "no-store";
    }
}