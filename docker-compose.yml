services:

  # ── Client ──────────────────────────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      # Mount the scenarios directory so Nginx can serve video files at
      # /scenarios/{scenario_id}/{file}. Read-only — the client never writes.
      - ./scenarios:/usr/share/nginx/html/scenarios:ro
    ports:
      - "3000:80"
    restart: unless-stopped

  # ── App ─────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: app/.env
    environment:
      EVALUATION_URL:    http://evaluation:8001
      FEEDBACK_URL:      http://feedback:8002
      TRANSCRIPTION_URL: http://transcription:8003
    volumes:
      - ./scenarios:/app/scenarios:ro
    ports:
      - "3001:3000"
    depends_on:
      transcription:
        condition: service_healthy
      evaluation:
        condition: service_healthy
      # feedback is intentionally excluded from depends_on.
      # An unreachable Feedback container is handled gracefully by the App,
      # which sends error { code: "feedback_unavailable" } to the client
      # rather than failing the session. The App must start even if feedback
      # is down.
    restart: unless-stopped

  # ── Transcription ────────────────────────────────────────────────────────────
  transcription:
    build:
      context: .
      dockerfile: transcription/Dockerfile
    env_file: transcription/.env
    expose:
      - "8003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/transcription/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Evaluation ───────────────────────────────────────────────────────────────
  evaluation:
    build:
      context: .
      dockerfile: evaluation/Dockerfile
    env_file: evaluation/.env
    volumes:
      # Persist the HuggingFace model cache across container recreations.
      # On first start the sentiment model is downloaded during warm_up().
      # Subsequent starts load from disk in a few seconds.
      # Remove this volume mount if you prefer a clean download on every start.
      - ./models/hf_cache:/root/.cache/huggingface
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/evaluate/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # The healthcheck passes immediately after uvicorn starts because
      # warm_up() runs in the background. start_period only needs to cover
      # the time for uvicorn itself to bind — a few seconds at most.
      # The generous window here is a safety margin for slow hosts.
      start_period: 30s
    restart: unless-stopped

  # ── Feedback ─────────────────────────────────────────────────────────────────
  feedback:
    build:
      context: .
      dockerfile: feedback/Dockerfile
    env_file: feedback/.env
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/feedback/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Ollama model loading can take up to 60 s on first start.
      # In stub mode this is irrelevant, but the same compose file is used
      # for production so a generous start_period avoids false-negative
      # healthcheck failures during model warm-up.
      start_period: 60s
    restart: unless-stopped

  # ── Ollama ───────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama
    volumes:
      # Bind-mount the repo's models/ directory to Ollama's default storage
      # path so pulled models are visible on the host and survive container
      # recreation without needing a separate Docker volume.
      # Pull models with: docker compose exec ollama ollama pull llama3.2
      - ./models:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped