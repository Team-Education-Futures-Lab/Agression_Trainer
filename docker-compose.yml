# ─── Developer tools ──────────────────────────────────────────────────────────
# To enable unauthenticated database management endpoints for development, run:
#   docker compose --profile devtools up
# WARNING: Never use the devtools profile in a production or shared deployment.
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Client ──────────────────────────────────────────────────────────────────
  # Active on: docker compose up  (default profile)
  # Not active on: docker compose --profile devtools up
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      - ./scenarios:/usr/share/nginx/html/scenarios:ro
    ports:
      - "3000:80"
    profiles:
      - default
    restart: unless-stopped

  # ── Client (dev tools) ───────────────────────────────────────────────────────
  # Active on: docker compose --profile devtools up
  # Not active on: docker compose up
  # Extends client — only overrides build.args and profiles.
  # The VITE_DEV_TOOLS build arg causes the devtools page to be compiled in.
  # WARNING: Never use this profile in a production or shared deployment.
  client-devtools:
    extends:
      service: client
    build:
      args:
        VITE_DEV_TOOLS: "true"
    profiles:
      - devtools


  # ── App ─────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: app/.env
    environment:
      EVALUATION_URL:    http://evaluation:8001
      FEEDBACK_URL:      http://feedback:8002
      TRANSCRIPTION_URL: http://transcription:8003
      # DATA_DIR is set here as a compose-level default. It can be overridden
      # in app/.env if you want the database in a different location inside the
      # container. Must match the target of the data bind mount below.
      DATA_DIR:          /app/data
    volumes:
      - ./scenarios:/app/scenarios:ro
      # Persist the auth database (auth.db) across container recreations.
      # The ./data directory is created automatically by Docker Compose if absent.
      # Do NOT mount this read-only — the App container writes to auth.db.
      - ./data:/app/data
    ports:
      - "3001:3000"
    depends_on:
      transcription:
        condition: service_healthy
      evaluation:
        condition: service_healthy
      # feedback is intentionally excluded from depends_on.
      # An unreachable Feedback container is handled gracefully by the App,
      # which sends error { code: "feedback_unavailable" } to the client
      # rather than failing the session. The App must start even if feedback
      # is down.
    restart: unless-stopped
    profiles:
      - default

  # ── App (dev tools override) ─────────────────────────────────────────────────
  # Only active when started with: docker compose --profile devtools up
  # Extends the base app service and adds DEV_TOOLS_ENABLED=true.
  # WARNING: Never use this profile in a production or shared deployment.
  app-devtools:
    extends:
      service: app
    environment:
      EVALUATION_URL:    http://evaluation:8001
      FEEDBACK_URL:      http://feedback:8002
      TRANSCRIPTION_URL: http://transcription:8003
      DATA_DIR:          /app/data
      DEV_TOOLS_ENABLED: "true"
    profiles:
      - devtools

  # ── Transcription ────────────────────────────────────────────────────────────
  transcription:
    build:
      context: .
      dockerfile: transcription/Dockerfile
    env_file: transcription/.env
    expose:
      - "8003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/transcription/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ── Evaluation ───────────────────────────────────────────────────────────────
  evaluation:
    build:
      context: .
      dockerfile: evaluation/Dockerfile
    env_file: evaluation/.env
    volumes:
      # Persist the HuggingFace model cache across container recreations.
      - ./models/hf_cache:/root/.cache/huggingface
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/evaluate/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ── Feedback ─────────────────────────────────────────────────────────────────
  feedback:
    build:
      context: .
      dockerfile: feedback/Dockerfile
    env_file: feedback/.env
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/feedback/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ── Ollama ───────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama
    volumes:
      - ./models:/root/.ollama
    expose:
      - "11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped